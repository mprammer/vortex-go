name: Go reader
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - run: go test -race ./...
        if: runner.os == 'Linux'
      - run: go vet ./...
